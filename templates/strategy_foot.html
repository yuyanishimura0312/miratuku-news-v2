    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/shared/utilities.js"></script>
  <script src="js/shared/auth-guard.js"></script>
  <script src="js/shared/nav.js"></script>
  <script>
    initNav('strategy');

    // Top-level switching (戦略 / コンテンツ / テーマ別) with URL hash sync
    function activateTopTab(key, opts) {
      opts = opts || {};
      var btn = document.querySelector('.strategy-top-btn[data-top="' + key + '"]');
      var panel = document.getElementById('top-' + key);
      if (!btn || !panel) return false;
      document.querySelectorAll('.strategy-top-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.strategy-top-panel').forEach(function(p) { p.classList.remove('active'); });
      btn.classList.add('active');
      panel.classList.add('active');
      if (opts.updateHash !== false) {
        try { history.replaceState(null, '', '#' + key); } catch (e) { location.hash = key; }
      }
      return true;
    }
    document.querySelectorAll('.strategy-top-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        activateTopTab(this.dataset.top);
      });
    });

    // Initial hash routing — switch to tab from URL hash on load
    function applyHashRouting() {
      var hash = (location.hash || '').replace(/^#/, '');
      if (hash && document.querySelector('.strategy-top-btn[data-top="' + hash + '"]')) {
        activateTopTab(hash, { updateHash: false });
      }
    }
    applyHashRouting();
    window.addEventListener('hashchange', applyHashRouting);

    // Sub-tab switching for 戦略 panel (data-panel)
    document.querySelectorAll('.strategy-tab[data-panel]').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var siblings = this.parentElement.querySelectorAll('.strategy-tab');
        siblings.forEach(function(t) { t.classList.remove('active'); });
        var container = this.closest('.strategy-top-panel');
        container.querySelectorAll('.strategy-panel').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('panel-' + this.dataset.panel).classList.add('active');
      });
    });

    // Sub-tab switching for コンテンツ panel (data-cpanel)
    document.querySelectorAll('.strategy-tab[data-cpanel]').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var siblings = this.parentElement.querySelectorAll('.strategy-tab');
        siblings.forEach(function(t) { t.classList.remove('active'); });
        var container = this.closest('.strategy-top-panel');
        container.querySelectorAll('.strategy-panel').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        document.getElementById('cpanel-' + this.dataset.cpanel).classList.add('active');
      });
    });
  </script>
</body>
</html>
