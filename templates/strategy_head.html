<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戦略＆コンテンツ | Insight News</title>
  <link rel="icon" href="https://esse-sense.com/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/series-listing.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/shared/firebase-config.js"></script>
  <style>
    /* Top-level segmented control */
    .strategy-toplevel {
      display: inline-flex;
      gap: 0;
      border: 1px solid var(--border, #d9d9d9);
      margin-bottom: 28px;
      background: var(--card, #fff);
    }
    .strategy-top-btn {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      font-weight: 500;
      padding: 10px 28px;
      cursor: pointer;
      color: var(--text-secondary, #666);
      background: transparent;
      border: none;
      transition: background .15s, color .15s;
    }
    .strategy-top-btn:not(:last-child) {
      border-right: 1px solid var(--border, #d9d9d9);
    }
    .strategy-top-btn:hover { color: var(--text, #121212); }
    .strategy-top-btn.active {
      background: var(--accent-warm, #CC1400);
      color: #fff;
      font-weight: 700;
    }
    .strategy-top-panel { display: none; }
    .strategy-top-panel.active { display: block; }

    /* Sub-tab navigation (used inside both 戦略 and コンテンツ) */
    .strategy-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border, #d9d9d9);
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .strategy-tab {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      font-weight: 500;
      padding: 10px 24px;
      cursor: pointer;
      color: var(--text-secondary, #666);
      border-bottom: 2px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      transition: color .15s, border-color .15s;
    }
    .strategy-tab:hover { color: var(--text, #121212); }
    .strategy-tab.active {
      color: var(--text, #121212);
      border-bottom-color: var(--accent-warm, #CC1400);
      font-weight: 700;
    }
    .strategy-panel { display: none; }
    .strategy-panel.active { display: block; }

    .strategy-coming-soon {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted, #999);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .9rem;
    }
    .strategy-coming-soon h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-secondary, #666);
      margin-bottom: 12px;
    }

    /* Theme management cards */
    .theme-intro {
      background: var(--surface, #F7F7F5);
      border-left: 4px solid var(--accent-warm, #CC1400);
      padding: 16px 20px;
      margin-bottom: 28px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      line-height: 1.7;
      color: var(--text-secondary, #555);
    }
    .theme-intro strong { color: var(--accent-warm, #CC1400); font-weight: 700; }
    .theme-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .theme-card {
      background: var(--card, #fff);
      border: 1px solid var(--border, #d9d9d9);
      padding: 24px 28px;
      transition: border-color .15s;
    }
    .theme-card:hover { border-color: var(--accent-warm, #CC1400); }
    .theme-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .theme-card-titlewrap { flex: 1; min-width: 240px; }
    .theme-card-eyebrow {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem;
      letter-spacing: .18em;
      color: var(--accent-warm, #CC1400);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .theme-card-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text, #121212);
      margin-bottom: 4px;
    }
    .theme-card-sub {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .76rem;
      color: var(--text-muted, #999);
      line-height: 1.5;
    }
    .theme-status {
      display: inline-block;
      padding: 4px 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .theme-status-public {
      background: var(--accent-warm, #CC1400);
      color: #fff;
    }
    .theme-status-dev {
      background: var(--surface, #F7F7F5);
      color: var(--text-secondary, #555);
      border: 1px solid var(--border, #d9d9d9);
    }
    .theme-status-plan {
      background: transparent;
      color: var(--text-muted, #999);
      border: 1px dashed var(--border, #d9d9d9);
    }
    .theme-card-desc {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      line-height: 1.75;
      color: var(--text, #121212);
      margin: 8px 0 16px;
    }
    .theme-card-verb {
      font-family: 'Noto Serif JP', serif;
      font-style: italic;
      color: var(--accent-warm, #CC1400);
      font-size: .88rem;
      margin-bottom: 12px;
      padding: 8px 14px;
      background: rgba(204,20,0,0.04);
      border-left: 3px solid var(--accent-warm, #CC1400);
    }
    .theme-report-info {
      background: var(--surface, #F7F7F5);
      border: 1px solid var(--border-light, #eee);
      padding: 12px 16px;
      margin: 14px 0;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .78rem;
      line-height: 1.7;
    }
    .theme-report-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      align-items: baseline;
      padding: 4px 0;
    }
    .theme-report-row:not(:last-child) {
      border-bottom: 1px dashed var(--border-light, #eee);
    }
    .theme-report-label {
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent-warm, #CC1400);
      font-weight: 700;
    }
    .theme-report-value { color: var(--text, #121212); word-break: break-all; }
    .theme-report-value a {
      color: var(--accent-warm, #CC1400);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-warm, #CC1400);
    }
    .theme-report-value a:hover { background: var(--accent-muted, rgba(204,20,0,0.06)); }
    .theme-report-value strong {
      color: var(--accent-warm, #CC1400);
      font-weight: 700;
    }
    .theme-resources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-light, #eee);
    }
    .theme-resource {
      display: block;
      padding: 8px 12px;
      background: var(--surface, #F7F7F5);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .72rem;
      color: var(--text-secondary, #555);
      text-decoration: none;
      border-left: 2px solid var(--accent-warm, #CC1400);
      transition: background .15s, color .15s;
    }
    .theme-resource:hover {
      background: rgba(204,20,0,0.06);
      color: var(--accent-warm, #CC1400);
    }
    .theme-resource-label {
      display: block;
      font-size: .62rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted, #999);
      margin-bottom: 2px;
    }
    .theme-resource-empty {
      background: transparent;
      color: var(--text-muted, #ccc);
      border-left: 2px dashed var(--border, #d9d9d9);
      cursor: default;
      font-style: italic;
    }
    .theme-resource-empty:hover { background: transparent; color: var(--text-muted, #ccc); }
    .theme-supplementary {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(204,20,0,0.02);
      border: 1px dashed var(--border-light, #eee);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .72rem;
      color: var(--text-muted, #999);
    }
    .theme-supplementary-label {
      font-weight: 700;
      color: var(--accent-warm, #CC1400);
      letter-spacing: .05em;
      font-size: .68rem;
      margin-right: 8px;
    }
    .theme-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .7rem;
      color: var(--text-muted, #999);
    }
    .theme-meta span strong { color: var(--text-secondary, #555); font-weight: 700; margin-right: 4px; }
    .theme-add-card {
      background: rgba(204,20,0,0.02);
      border: 2px dashed var(--border, #d9d9d9);
      padding: 32px 28px;
      text-align: center;
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text-muted, #999);
    }
    .theme-add-card h3 {
      font-size: .95rem;
      color: var(--accent-warm, #CC1400);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .theme-add-card p {
      font-size: .76rem;
      line-height: 1.7;
      max-width: 540px;
      margin: 0 auto;
    }
    .theme-add-card code {
      background: var(--surface, #F7F7F5);
      padding: 2px 6px;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: .72rem;
      color: var(--text, #121212);
    }

    /* Strategy report list (existing) */
    .str-report-list { display: flex; flex-direction: column; gap: 12px; }
    .str-report-card {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 16px 20px;
      background: var(--card, #fff);
      border: 1px solid var(--border, #d9d9d9);
      text-decoration: none; color: inherit;
      transition: border-color .15s;
    }
    .str-report-card:hover { border-color: var(--accent-warm, #CC1400); }
    .str-report-date {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem; color: var(--text-muted, #999);
      white-space: nowrap; min-width: 80px; padding-top: 2px;
    }
    .str-report-body { flex: 1; }
    .str-report-title {
      font-family: 'Noto Serif JP', serif;
      font-size: .95rem; font-weight: 700;
      line-height: 1.4; margin-bottom: 4px;
    }
    .str-report-desc {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .78rem; color: var(--text-secondary, #666);
      line-height: 1.6;
    }
    .str-report-tags {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .str-report-tag {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .65rem; padding: 2px 8px;
      border: 1px solid var(--border, #d9d9d9);
      color: var(--text-muted, #999);
    }

    /* Content (100-article series) */
    .series-hero {
      background: var(--card, #fff);
      border: 1px solid var(--border, #d9d9d9);
      border-left: 4px solid var(--accent-warm, #CC1400);
      padding: 28px 32px;
      margin-bottom: 32px;
    }
    .series-hero-eyebrow {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem; font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent-warm, #CC1400);
      margin-bottom: 10px;
    }
    .series-hero-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.4rem; font-weight: 700;
      color: var(--text, #121212);
      margin-bottom: 12px; line-height: 1.45;
    }
    .series-hero-desc {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem; color: var(--text-secondary, #555);
      line-height: 1.85;
      margin-bottom: 18px;
    }
    .series-hero-meta {
      display: flex; flex-wrap: wrap; gap: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light, #eee);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .72rem;
      color: var(--text-muted, #999);
    }
    .series-meta-item { display: flex; gap: 6px; align-items: baseline; }
    .series-meta-item strong { color: var(--text, #121212); font-weight: 700; }

    .content-part-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 36px;
      padding: 16px;
      background: var(--surface, #f7f7f5);
      border: 1px solid var(--border-light, #eee);
    }
    .content-part-nav-item {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 12px;
      background: var(--card, #fff);
      border: 1px solid var(--border, #d9d9d9);
      text-decoration: none; color: inherit;
      transition: border-color .15s;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .content-part-nav-item:hover { border-color: var(--accent-warm, #CC1400); }
    .content-part-nav-item span:first-child {
      font-size: .62rem; font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent-warm, #CC1400);
    }
    .content-part-nav-item span:last-child {
      font-size: .76rem; font-weight: 500;
      color: var(--text, #121212);
      line-height: 1.4;
    }

    .content-part {
      margin-bottom: 48px;
      scroll-margin-top: 80px;
    }
    .content-part-header {
      display: flex; align-items: baseline; gap: 16px;
      padding: 12px 0;
      border-bottom: 2px solid var(--text, #121212);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .content-part-label {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem; font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--accent-warm, #CC1400);
    }
    .content-part-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.1rem; font-weight: 700;
      color: var(--text, #121212);
      flex: 1;
    }
    .content-part-count {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem;
      color: var(--text-muted, #999);
      letter-spacing: 0.1em;
    }
    .content-ep-list {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column;
      gap: 4px;
    }
    .content-ep { padding: 0; }
    .content-ep-link {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 12px 14px;
      background: var(--card, #fff);
      border: 1px solid transparent;
      border-bottom: 1px solid var(--border-light, #eee);
      text-decoration: none; color: inherit;
      transition: background .12s, border-color .12s;
    }
    .content-ep-link:not(.content-ep-disabled):hover {
      background: var(--surface, #f7f7f5);
      border-color: var(--accent-warm, #CC1400);
    }
    .content-ep-disabled {
      cursor: default;
      opacity: 0.55;
    }
    .content-ep-num {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .72rem; font-weight: 700;
      color: var(--accent-warm, #CC1400);
      min-width: 36px;
      letter-spacing: 0.04em;
      padding-top: 2px;
    }
    .content-ep-body {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 3px;
    }
    .content-ep-eyebrow {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .62rem; font-weight: 500;
      color: var(--text-muted, #999);
      letter-spacing: 0.08em;
    }
    .content-ep-title {
      font-family: 'Noto Serif JP', serif;
      font-size: .9rem; font-weight: 700;
      color: var(--text, #121212);
      line-height: 1.5;
    }
    .content-ep-sub {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .72rem;
      color: var(--text-secondary, #555);
      line-height: 1.65;
    }
    .content-ep-domain {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .62rem;
      color: var(--text-muted, #999);
      margin-top: 2px;
    }
    .content-ep-status {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .58rem;
      padding: 2px 8px;
      align-self: flex-start;
      border: 1px solid var(--border, #d9d9d9);
      letter-spacing: 0.06em;
    }
    .content-ep-status-published {
      color: var(--accent-warm, #CC1400);
      border-color: var(--accent-warm, #CC1400);
    }
    .content-ep-status-upcoming {
      color: var(--text-muted, #999);
    }
    .content-ep-upcoming .content-ep-num { color: var(--text-muted, #999); }

    /* Content series cards (for non-detailed series) */
    .series-card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .series-card {
      display: block;
      padding: 22px 24px;
      background: var(--card, #fff);
      border: 1px solid var(--border, #d9d9d9);
      text-decoration: none; color: inherit;
      transition: border-color .15s, transform .15s;
    }
    .series-card:hover {
      border-color: var(--accent-warm, #CC1400);
      transform: translateY(-2px);
    }
    .series-card-eyebrow {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .62rem; font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent-warm, #CC1400);
      margin-bottom: 8px;
    }
    .series-card-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 1rem; font-weight: 700;
      color: var(--text, #121212);
      margin-bottom: 10px; line-height: 1.5;
    }
    .series-card-desc {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .76rem;
      color: var(--text-secondary, #555);
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .series-card-status {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .68rem;
      color: var(--text-muted, #999);
      letter-spacing: 0.06em;
    }

    @media (max-width: 720px) {
      .strategy-tab { padding: 10px 14px; }
      .strategy-top-btn { padding: 10px 16px; }
      .series-hero { padding: 22px 20px; }
      .content-ep-num { min-width: 30px; }
    }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="container">
    <section class="app-section">
      <div class="section-header">
        <h2 class="section-title">戦略＆コンテンツ</h2>
        <span class="section-subtitle">Strategy &amp; Content — 戦略レポートと連載アーカイブ</span>
      </div>

      <!-- Top-level: 戦略 / コンテンツ / テーマ別 -->
      <div class="strategy-toplevel">
        <button class="strategy-top-btn active" data-top="strategy">戦略</button>
        <button class="strategy-top-btn" data-top="content">コンテンツ</button>
        <button class="strategy-top-btn" data-top="themes">テーマ別</button>
      </div>
