<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ doc_title }}</title>
<link rel="icon" href="https://esse-sense.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_repo-system/css/repo-textbook.css">
</head>
<body>

<div class="top-bar">
  <span class="top-bar-brand">{{ brand_name }} ／ {{ db_name }} ダッシュボード</span>
</div>

<div class="tb-layout">
  <aside class="toc-sidebar" aria-label="目次">
    {{ toc_html|safe }}
  </aside>

  <main class="tb-main">
    <h1 style="font-size:28px; font-weight:700; margin: 0 0 8px;">{{ db_name }} ダッシュボード</h1>
    <p style="font-family: 'Noto Sans JP', sans-serif; color: var(--tb-ink-soft); margin: 0 0 32px;">{{ db_description }}</p>

    <!-- 集計サマリー -->
    <section class="chapter-section">
      <div class="chapter-num">SUMMARY</div>
      <h2 class="chapter-title">概要</h2>
      {{ summary_html|safe }}
    </section>

    <!-- 各セクション -->
    {% for section in sections %}
    <section class="chapter-section" id="section-{{ section.id }}">
      <div class="chapter-num">{{ section.label }}</div>
      <h2 class="chapter-title">{{ section.title }}</h2>
      {{ section.body_html|safe }}
    </section>
    {% endfor %}
  </main>
</div>

</body>
</html>
