<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ doc_title }}</title>
<link rel="icon" href="https://esse-sense.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_repo-system/css/repo-textbook.css">
<script>
  (function(){
    var saved = localStorage.getItem("tb-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>

<div class="top-bar">
  <span class="top-bar-brand">{{ brand_name }}</span>
  <button class="theme-toggle" onclick="
    var html = document.documentElement;
    var cur = html.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tb-theme', next);
  " aria-label="ダーク／ライトモード切替">☾ / ☀</button>
</div>

<div class="tb-layout">
  <aside class="toc-sidebar" aria-label="目次">
    {{ toc_html|safe }}
  </aside>

  <main class="tb-main">
    <h1 style="font-size:32px; font-weight:700; margin: 0 0 12px;">{{ doc_title }}</h1>
    {% if doc_subtitle %}<p style="font-family: 'Noto Sans JP', sans-serif; color: var(--tb-ink-soft); margin: 0 0 48px;">{{ doc_subtitle }}</p>{% endif %}

    {% for chapter in chapters %}
    <section class="chapter-section" id="chapter-{{ chapter.num }}">
      <div class="chapter-num">CHAPTER {{ chapter.num }}</div>
      <h2 class="chapter-title">{{ chapter.title }}</h2>
      {% if chapter.title_en %}<p class="chapter-en"><em>{{ chapter.title_en }}</em></p>{% endif %}
      {{ chapter.body_html|safe }}
    </section>
    {% endfor %}
  </main>
</div>

</body>
</html>
