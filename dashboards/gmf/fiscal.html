<script>
const svg=d3.select("#tm"),W=960,H=520;
function fmt(v){return v>=1e12?'$'+(v/1e12).toFixed(2)+'T':v>=1e9?'$'+(v/1e9).toFixed(0)+'B':'$'+(v/1e6).toFixed(0)+'M';}
function draw(code){
  svg.selectAll("*").remove();
  const d=TM[code]; if(!d||!d.sectors.length){svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('fill','var(--mute)').text('データなし');return;}
  const root=d3.hierarchy({children:d.sectors}).sum(x=>x.v).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingInner(2)(root);
  const n=root.leaves().length;
  const col=d3.scaleOrdinal(d3.quantize(t=>d3.interpolateRgb(BASE,'#cfe6cf')(t),Math.max(2,n)));
  const g=svg.selectAll("g").data(root.leaves()).join("g").attr("transform",d=>`translate(${d.x0},${d.y0})`);
  g.append("rect").attr("width",d=>d.x1-d.x0).attr("height",d=>d.y1-d.y0).attr("fill",(d,i)=>col(i)).attr("stroke","var(--bg)")
    .append("title").text(d=>`${d.data.s}: ${fmt(d.value)}`);
  g.append("text").attr("x",4).attr("y",15).attr("fill","#fff").style("font-size","11px").style("font-weight","700")
    .each(function(d){const w=d.x1-d.x0,h=d.y1-d.y0;const t=d3.select(this);
      if(w>62&&h>26){t.text(d.data.s);t.append('tspan').attr('x',4).attr('y',30).style('font-weight','400').style('font-size','10px').text(fmt(d.value));}});
}
const sel=document.getElementById('csel');
sel.addEventListener('change',e=>draw(e.target.value));
draw(sel.value);window.addEventListener('themechange',()=>draw(sel.value));
</script>
