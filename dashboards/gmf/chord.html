function draw(){
  svg.selectAll("*").remove();
  const d=((CDATA[ft]||{})[year])||((CDATA[ft]||{})[2021]);
  if(!d){svg.append('text').attr('x',W/2).attr('y',W/2).attr('text-anchor','middle').attr('fill','var(--mute)').text('データなし');return;}
  const labels=d.labels,mat=d.matrix,n=labels.length;
  const g=svg.append("g").attr("transform",`translate(${W/2},${W/2})`);
  const chord=d3.chordDirected().padAngle(.04).sortSubgroups(d3.descending)(mat);
  const arc=d3.arc().innerRadius(ir).outerRadius(or_);
  const ribbon=d3.ribbonArrow().radius(ir-2);
  // 外弧(国)
  const grp=g.append("g").selectAll("g").data(chord.groups).join("g");
  grp.append("path").attr("d",arc).attr("fill",dd=>color(dd.index,n))
     .attr("stroke","var(--bg)").style("cursor","pointer")
     .on("mouseover",(e,dd)=>{const i=dd.index;
       g.selectAll("path.rib").transition().duration(150)
         .attr("fill-opacity",r=>(r.source.index===i||r.target.index===i)?.85:.04);})
     .on("mouseout",()=>{g.selectAll("path.rib").transition().duration(150).attr("fill-opacity",.62);})
     .append("title").text(dd=>labels[dd.index]);
  grp.append("text").each(dd=>{dd.ang=(dd.startAngle+dd.endAngle)/2;})
     .attr("dy",".35em")
     .attr("transform",dd=>`rotate(${dd.ang*180/Math.PI-90}) translate(${or_+6}) ${dd.ang>Math.PI?'rotate(180)':''}`)
     .attr("text-anchor",dd=>dd.ang>Math.PI?"end":null)
     .attr("font-size","11px").attr("fill","var(--text)").text(dd=>labels[dd.index]);
  // リボン(送り手色)
  g.append("g").attr("fill-opacity",.62).selectAll("path").data(chord).join("path")
    .attr("class","rib").attr("d",ribbon).attr("fill",dd=>color(dd.source.index,n))
    .attr("stroke","var(--bg)").attr("stroke-width",.3)
    .append("title").text(dd=>`${labels[dd.source.index]} → ${labels[dd.target.index]}: ${fmt(dd.source.value)}`);
}
document.getElementById('yr').addEventListener('input',e=>{year=+e.target.value;document.getElementById('yrlab').textContent=year;draw();});
document.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');ft=b.dataset.ft;draw();}));
window.addEventListener('themechange',draw);
draw();
</script>
<style>
.cbtn{background:none;border:1px solid var(--border);border-radius:14px;padding:3px 11px;margin:2px;cursor:pointer;font-size:11.5px;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.cbtn.on{color:var(--text);border-color:var(--c)}
.cbtn .sw{width:9px;height:9px;border-radius:50%;opacity:.35}.cbtn.on .sw{opacity:1}
</style>

</body></html>
