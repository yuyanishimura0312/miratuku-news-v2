<script>
const svg=d3.select("#sankey"),W=960,H=640;
function fmt(v){return v>=1e12?'$'+(v/1e12).toFixed(1)+'T':v>=1e9?'$'+(v/1e9).toFixed(0)+'B':'$'+(v/1e6).toFixed(0)+'M';}
function draw(){
  svg.selectAll("*").remove();
  if(!NODES.length){svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('fill','var(--mute)').text('分野データ読込中…');return;}
  const sankey=d3.sankey().nodeWidth(14).nodePadding(11).extent([[8,10],[W-8,H-14]]);
  const graph=sankey({nodes:NODES.map(d=>Object.assign({},d)),links:LINKS.map(d=>Object.assign({},d))});
  const secColor=d3.scaleOrdinal(d3.quantize(t=>d3.interpolateRgb(SC.sectorbase,'#f0c0b8')(t),19));
  // links
  svg.append("g").attr("fill","none").selectAll("path").data(graph.links).join("path")
    .attr("d",d3.sankeyLinkHorizontal())
    .attr("stroke",d=>d.target.kind==='sector'?secColor(d.target.key):'#bbb')
    .attr("stroke-width",d=>Math.max(1,d.width)).attr("opacity",.45)
    .append("title").text(d=>`${d.source.name} → ${d.target.name}: ${fmt(d.value)}`);
  // nodes
  const n=svg.append("g").selectAll("rect").data(graph.nodes).join("rect")
    .attr("x",d=>d.x0).attr("y",d=>d.y0).attr("height",d=>Math.max(1,d.y1-d.y0)).attr("width",d=>d.x1-d.x0)
    .attr("fill",d=>d.kind==='country'?'var(--text)':secColor(d.key));
  n.append("title").text(d=>`${d.name}: ${fmt(d.value)}`);
  svg.append("g").style("font-size","10.5px").selectAll("text").data(graph.nodes).join("text")
    .attr("x",d=>d.kind==='country'?d.x1+5:d.x0-5).attr("y",d=>(d.y0+d.y1)/2).attr("dy",".35em")
    .attr("text-anchor",d=>d.kind==='country'?"start":"end").attr("fill","var(--text)").text(d=>d.name);
}
draw();window.addEventListener('themechange',draw);
</script>
