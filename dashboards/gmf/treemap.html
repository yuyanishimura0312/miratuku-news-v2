.viz{width:100%;background:var(--surface);border:1px solid var(--bl);border-radius:5px;overflow:hidden}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0;font-size:12.5px}
select,input[type=range]{font-family:inherit;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.kpi{border:1px solid var(--bl);border-top:2px solid var(--warm);border-radius:4px;padding:12px}

  const n=root.leaves().length;
  const col=d3.scaleOrdinal(d3.quantize(t=>d3.interpolateRgb(BASE,'#f2cfc8')(t),Math.max(2,n)));
  const g=svg.selectAll("g").data(root.leaves()).join("g").attr("transform",d=>`translate(${d.x0},${d.y0})`);
  g.append("rect").attr("width",d=>d.x1-d.x0).attr("height",d=>d.y1-d.y0)
    .attr("fill",(d,i)=>col(i)).attr("stroke","var(--bg)")
    .append("title").text(d=>`${d.data.s}: ${fmt(d.value)}`);
  g.append("text").attr("x",4).attr("y",15).attr("fill","#fff").style("font-size","11px").style("font-weight","700")
    .each(function(d){const w=d.x1-d.x0,h=d.y1-d.y0;const t=d3.select(this);
      if(w>62&&h>26){t.text(d.data.s);t.append('tspan').attr('x',4).attr('y',30).style('font-weight','400').style('font-size','10px').text(fmt(d.value));}});
}
document.getElementById('csel').addEventListener('change',e=>draw(e.target.value));
draw("WORLD");window.addEventListener('themechange',()=>draw(document.getElementById('csel').value));
</script>
