<!-- ============ 図解1：3コミュニティ系譜 ============ -->
<div class="diagram-wrap">
  <figure class="diagram">
    <svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3つのコミュニティの系譜タイムライン" style="width:100%;height:auto;font-family:'Noto Sans JP',sans-serif;">

      <!-- タイトル -->
      <text x="20" y="32" fill="#D8D5D1" font-size="16" font-weight="600" letter-spacing="0.05em">3つのコミュニティの系譜</text>

      <!-- 横軸ベースライン -->
      <line x1="60" y1="250" x2="860" y2="250" stroke="#5A5650" stroke-width="1"/>

      <!-- 横軸目盛り（2011, 2014, 2017, 2020, 2023, 2026, 2027） -->
      <!-- スケール: x = 60 + ((year-2011) / 16) * 800 -->
      <!-- 2011=60, 2014=210, 2017=360, 2020=510, 2023=660, 2026=810, 2027=860 -->
      <g font-size="10" fill="#9A9690" letter-spacing="0.05em">
        <line x1="60"  y1="248" x2="60"  y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="60"  y="270" text-anchor="middle">2011</text>
        <line x1="210" y1="248" x2="210" y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="210" y="270" text-anchor="middle">2014</text>
        <line x1="360" y1="248" x2="360" y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="360" y="270" text-anchor="middle">2017</text>
        <line x1="510" y1="248" x2="510" y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="510" y="270" text-anchor="middle">2020</text>
        <line x1="660" y1="248" x2="660" y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="660" y="270" text-anchor="middle">2023</text>
        <line x1="810" y1="248" x2="810" y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="810" y="270" text-anchor="middle">2026</text>
        <line x1="860" y1="248" x2="860" y2="256" stroke="#7A7672" stroke-width="1"/>
        <text x="860" y="270" text-anchor="middle">2027</text>
      </g>

      <!-- 縦のガイドライン（薄く） -->
      <g stroke="#3A3630" stroke-width="0.5" stroke-dasharray="2,4">
        <line x1="60"  y1="60" x2="60"  y2="248"/>
        <line x1="210" y1="60" x2="210" y2="248"/>
        <line x1="360" y1="60" x2="360" y2="248"/>
        <line x1="510" y1="60" x2="510" y2="248"/>
        <line x1="660" y1="60" x2="660" y2="248"/>
        <line x1="810" y1="60" x2="810" y2="248"/>
      </g>

      <!-- 帯1: メンバーシップ 2011-2017（x: 60→360、y: 80、h: 40） -->
      <g>
        <rect x="60" y="80" width="300" height="40" rx="6" ry="6" fill="#7A7672" opacity="0.85"/>
        <circle cx="60" cy="100" r="5" fill="#D8D5D1"/>
        <text x="76" y="105" fill="#1C1410" font-size="13" font-weight="600" letter-spacing="0.04em">メンバーシップ</text>
        <text x="200" y="105" fill="#1C1410" font-size="11" letter-spacing="0.03em" opacity="0.85">2011-2017 ／ 7年 ／ 異分野横断の場づくり</text>
      </g>

      <!-- 帯2: ROOM 2020-2025（x: 510→785、y: 140、h: 40） -->
      <!-- 2025のx = 60 + (14/16)*800 = 760 -->
      <g>
        <rect x="510" y="140" width="250" height="40" rx="6" ry="6" fill="#D8D5D1" opacity="0.92"/>
        <circle cx="510" cy="160" r="5" fill="#FFFFFF"/>
        <text x="526" y="165" fill="#1C1410" font-size="13" font-weight="600" letter-spacing="0.04em">ROOM</text>
        <text x="590" y="165" fill="#1C1410" font-size="11" letter-spacing="0.03em" opacity="0.85">2020-2025 ／ 5年 ／ 探究と対話のコミュニティ</text>
      </g>

      <!-- 帯3: Futures 2026-2027（実線部）+ 点線延長 -->
      <g>
        <!-- 実線本体 2026→2027 -->
        <rect x="810" y="200" width="50" height="40" rx="6" ry="6" fill="#FF3644"/>
        <!-- 点線延長（継続予定） -->
        <rect x="860" y="200" width="30" height="40" rx="6" ry="6" fill="none" stroke="#FF3644" stroke-width="1.5" stroke-dasharray="4,4"/>
        <circle cx="810" cy="220" r="5" fill="#FFFFFF"/>
        <!-- ラベル（帯が短いので左外に置く） -->
        <text x="540" y="225" fill="#FF3644" font-size="13" font-weight="700" letter-spacing="0.04em">Futures</text>
        <text x="615" y="225" fill="#D8D5D1" font-size="11" letter-spacing="0.03em">2026-2027 ／ 現在進行 ／ 2100年へ向かう長い坂</text>
      </g>

      <!-- 下部キャプション -->
      <text x="20" y="22" fill="#9A9690" font-size="10" letter-spacing="0.05em" opacity="0">spacer</text>
      <text x="450" y="55" fill="#9A9690" font-size="11" text-anchor="middle" letter-spacing="0.05em">ミラツクの基盤として、3世代のコミュニティが積み重ねられている</text>

    </svg>
    <figcaption>図1｜3つのコミュニティの系譜。2011年から積み重ねられてきた基盤の上に、2026年からFuturesが立ち上がる</figcaption>
  </figure>
</div>

<!-- ============ 図解2：接続マップ ============ -->
<div class="diagram-wrap">
  <figure class="diagram">
    <svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Futuresと外部プロジェクトの接続マップ" style="width:100%;height:auto;font-family:'Noto Sans JP',sans-serif;">

      <!-- 上下セクションラベル -->
      <text x="20" y="28" fill="#D8D5D1" font-size="13" font-weight="600" letter-spacing="0.06em">内部成果物（DH 蓄積）</text>
      <text x="20" y="468" fill="#FF3644" font-size="13" font-weight="600" letter-spacing="0.06em">外部協働プロジェクト</text>

      <!-- 中央分割の薄い水平線 -->
      <line x1="40" y1="240" x2="860" y2="240" stroke="#3A3630" stroke-width="0.5" stroke-dasharray="2,5"/>

      <!-- ===== 接続線（先に描画して円の下に置く） ===== -->
      <!-- 中央(450,240) → 内部成果物（実線） -->
      <g stroke="#D8D5D1" stroke-width="1.5" opacity="0.55">
        <line x1="450" y1="240" x2="180" y2="120"/>
        <line x1="450" y1="240" x2="360" y2="70"/>
        <line x1="450" y1="240" x2="540" y2="70"/>
        <line x1="450" y1="240" x2="720" y2="120"/>
      </g>
      <!-- 中央(450,240) → 外部協働（点線） -->
      <g stroke="#FF3644" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75">
        <line x1="450" y1="240" x2="240" y2="380"/>
        <line x1="450" y1="240" x2="450" y2="420"/>
        <line x1="450" y1="240" x2="660" y2="380"/>
      </g>

      <!-- ===== 中央ノード Futures ===== -->
      <g>
        <circle cx="450" cy="240" r="55" fill="#FF3644"/>
        <circle cx="450" cy="240" r="55" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
        <text x="450" y="238" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="0.06em">Futures</text>
        <text x="450" y="258" text-anchor="middle" fill="#FFFFFF" font-size="11" letter-spacing="0.08em" opacity="0.9">2026-2027</text>
      </g>

      <!-- ===== 内部成果物 4つ ===== -->
      <!-- 1. 書籍『深い知が拓く2100年』 cx=180, cy=120, r=42 -->
      <g>
        <circle cx="180" cy="120" r="42" fill="#261C16" stroke="#D8D5D1" stroke-width="1.2"/>
        <text x="180" y="113" text-anchor="middle" fill="#D8D5D1" font-size="10" font-weight="600" letter-spacing="0.04em">書籍</text>
        <text x="180" y="128" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em">『深い知が</text>
        <text x="180" y="141" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em">拓く2100年』</text>
      </g>
      <!-- 2. レポート『未来への問い』 cx=360, cy=70, r=40 -->
      <g>
        <circle cx="360" cy="70" r="40" fill="#261C16" stroke="#D8D5D1" stroke-width="1.2"/>
        <text x="360" y="65" text-anchor="middle" fill="#D8D5D1" font-size="10" font-weight="600" letter-spacing="0.04em">レポート</text>
        <text x="360" y="80" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em">『未来への問い』</text>
      </g>
      <!-- 3. 7+1の問い cx=540, cy=70, r=40 -->
      <g>
        <circle cx="540" cy="70" r="40" fill="#261C16" stroke="#D8D5D1" stroke-width="1.2"/>
        <text x="540" y="67" text-anchor="middle" fill="#D8D5D1" font-size="11" font-weight="600" letter-spacing="0.04em">7+1の問い</text>
        <text x="540" y="83" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em" opacity="0.85">構造的探究テーマ</text>
      </g>
      <!-- 4. 未来学教科書『未来を読む力』 cx=720, cy=120, r=42 -->
      <g>
        <circle cx="720" cy="120" r="42" fill="#261C16" stroke="#D8D5D1" stroke-width="1.2"/>
        <text x="720" y="113" text-anchor="middle" fill="#D8D5D1" font-size="10" font-weight="600" letter-spacing="0.04em">未来学教科書</text>
        <text x="720" y="128" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em">『未来を</text>
        <text x="720" y="141" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em">読む力』</text>
      </g>

      <!-- ===== 外部協働 3つ ===== -->
      <!-- 1. 井上ゆきさんプロジェクト cx=240, cy=380, r=38 -->
      <g>
        <circle cx="240" cy="380" r="38" fill="transparent" stroke="#FF3644" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="240" y="376" text-anchor="middle" fill="#D8D5D1" font-size="10" font-weight="600" letter-spacing="0.04em">井上ゆきさん</text>
        <text x="240" y="391" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em" opacity="0.85">プロジェクト</text>
      </g>
      <!-- 2. 博報堂協働プロジェクト cx=450, cy=420, r=38 -->
      <g>
        <circle cx="450" cy="420" r="38" fill="transparent" stroke="#FF3644" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="450" y="416" text-anchor="middle" fill="#D8D5D1" font-size="10" font-weight="600" letter-spacing="0.04em">博報堂</text>
        <text x="450" y="431" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em" opacity="0.85">協働プロジェクト</text>
      </g>
      <!-- 3. PwC協働プロジェクト cx=660, cy=380, r=38 -->
      <g>
        <circle cx="660" cy="380" r="38" fill="transparent" stroke="#FF3644" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="660" y="376" text-anchor="middle" fill="#D8D5D1" font-size="10" font-weight="600" letter-spacing="0.04em">PwC</text>
        <text x="660" y="391" text-anchor="middle" fill="#D8D5D1" font-size="9" letter-spacing="0.02em" opacity="0.85">協働プロジェクト</text>
      </g>

    </svg>
    <figcaption>図2｜Futuresは内部成果物（書籍・連載・教科書・問い）と外部協働プロジェクト（井上ゆき／博報堂／PwC）を結ぶ蝶番として機能する</figcaption>
  </figure>
</div>
