<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futures ― ただいま準備中 ／ NPO法人ミラツク</title>
<meta name="description" content="共に問うべき問いとともに未来を描く、ミラツクの学びのコミュニティ「Futures」。現在、次の形に向けて準備を進めています。">
<meta property="og:title" content="Futures ― ただいま準備中 ／ NPO法人ミラツク">
<meta property="og:description" content="共に問うべき問いとともに未来を描く学びのコミュニティ「Futures」。現在、次の形に向けて準備を進めています。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://journal.emerging-future.org/futures/">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://journal.emerging-future.org/futures/">
<link rel="icon" href="https://esse-sense.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Judson:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1410;
  --bg-alt:#261C16;
  --card:#1C1410;
  --card-hover:#261C16;
  --accent:#FFFFFF;
  --accent-soft:#D8D5D1;
  --accent-warm:#FF3644;
  --accent-warm-soft:#FF5560;
  --accent-muted:rgba(255,54,68,0.10);
  --accent-tint:rgba(255,54,68,0.22);
  --text:#FFFFFF;
  --text-secondary:#D8D5D1;
  --text-muted:#A6A29D;
  --text-faint:#7A7672;
  --border:#3A2E22;
  --border-light:#2A1F16;
  --highlight:#FF3644;
  --surface:#30251D;
  --logo-mark:url('miratuku-mark-white.png');
  --font:"Noto Sans JP","Hiragino Sans",-apple-system,sans-serif;
  --font-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --font-display:"Judson","Noto Serif JP",Georgia,serif;
}
[data-theme="light"]{
  --bg:#FAF6F0;
  --bg-alt:#F2EBDD;
  --card:#FFFFFF;
  --card-hover:#FAF6F0;
  --accent:#2A1F18;
  --accent-soft:#5A4838;
  --accent-warm:#ED2E3B;
  --accent-warm-soft:#FF3644;
  --accent-muted:rgba(237,46,59,0.08);
  --accent-tint:rgba(237,46,59,0.16);
  --text:#2A1F18;
  --text-secondary:#5A4838;
  --text-muted:#8B7A66;
  --text-faint:#B5A48E;
  --border:#D9CFBF;
  --border-light:#E8E0D0;
  --highlight:#ED2E3B;
  --surface:#F2EBDD;
  --logo-mark:url('miratuku-mark-real.png');
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-serif);
  font-feature-settings:"palt";
  background:var(--bg);
  color:var(--text);
  line-height:1.95;
  letter-spacing:0.025em;
  -webkit-font-smoothing:antialiased;
  transition:background 0.2s,color 0.2s;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a{color:var(--accent-warm);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent-warm-soft)}

/* TOP BAR */
.top-bar{
  position:sticky;top:0;z-index:10;
  height:64px;
  background:rgba(28,20,16,0.92);
  -webkit-backdrop-filter:saturate(160%) blur(10px);
  backdrop-filter:saturate(160%) blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
}
[data-theme="light"] .top-bar{background:rgba(250,246,240,0.92)}
.top-bar-brand{
  display:flex;align-items:center;gap:14px;
  color:var(--text);transition:color .15s;
}
.top-bar-brand:hover{color:var(--accent-warm)}
.top-bar-mark{
  width:40px;height:40px;
  background-image:var(--logo-mark);
  background-size:contain;background-repeat:no-repeat;background-position:center;
}
.top-bar-brand-name{
  font-family:var(--font);
  font-size:12.5px;font-weight:500;letter-spacing:0.18em;
}
.theme-toggle{
  display:inline-flex;align-items:center;gap:8px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-secondary);
  font-family:var(--font);
  font-size:11.5px;letter-spacing:0.14em;
  padding:8px 14px;
  cursor:pointer;
  transition:border-color .15s,color .15s;
}
.theme-toggle:hover{border-color:var(--accent-warm);color:var(--accent-warm)}
.theme-toggle svg{width:14px;height:14px}
.theme-icon-sun{display:none}
.theme-icon-moon{display:inline-block}
[data-theme="light"] .theme-icon-sun{display:inline-block}
[data-theme="light"] .theme-icon-moon{display:none}
.theme-toggle-label{font-family:var(--font)}

/* MAIN */
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 28px 100px;
  position:relative;
  overflow:hidden;
}
.hero{
  max-width:720px;
  width:100%;
  text-align:center;
  position:relative;
  z-index:1;
}
.hero-corner{
  position:absolute;
  width:56px;height:56px;
  color:var(--text-muted);
  opacity:0.5;
}
.hero-corner.tl{top:0;left:0}
.hero-corner.br{bottom:0;right:0;transform:rotate(180deg)}
.hero-corner svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.4;fill:none}

.hero-eyebrow{
  font-family:var(--font);
  font-size:11.5px;
  letter-spacing:0.28em;
  color:var(--accent-warm);
  margin-bottom:36px;
  text-transform:uppercase;
}
.hero-title{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(64px, 11vw, 124px);
  line-height:0.95;
  letter-spacing:-0.01em;
  margin-bottom:28px;
  color:var(--text);
}
.hero-title .accent{color:var(--accent-warm)}
.hero-status{
  font-family:var(--font-serif);
  font-weight:500;
  font-size:clamp(22px, 3.4vw, 30px);
  line-height:1.6;
  letter-spacing:0.06em;
  color:var(--text);
  margin-bottom:36px;
}
.hero-status-mark{
  display:inline-block;
  width:8px;height:8px;
  background:var(--accent-warm);
  border-radius:50%;
  margin-right:14px;
  vertical-align:middle;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.5;transform:scale(0.85)}
}
.hero-divider{
  width:48px;height:2px;
  background:var(--accent-warm);
  margin:0 auto 36px;
}
.hero-lead{
  font-family:var(--font-serif);
  font-size:16px;
  line-height:2.1;
  color:var(--text-secondary);
  margin-bottom:24px;
  max-width:560px;
  margin-left:auto;margin-right:auto;
}
.hero-lead strong{color:var(--text);font-weight:500}
.hero-meta{
  font-family:var(--font);
  font-size:12px;
  letter-spacing:0.14em;
  color:var(--text-muted);
  margin-bottom:48px;
}
.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font);
  font-size:12.5px;
  font-weight:500;
  letter-spacing:0.16em;
  padding:14px 28px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  transition:border-color .15s,color .15s,background .15s;
  cursor:pointer;
}
.btn:hover{
  border-color:var(--accent-warm);
  color:var(--accent-warm);
}
.btn-primary{
  background:var(--accent-warm);
  border-color:var(--accent-warm);
  color:#FFFFFF;
}
.btn-primary:hover{
  background:var(--accent-warm-soft);
  border-color:var(--accent-warm-soft);
  color:#FFFFFF;
}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:48px 28px 56px;
  text-align:center;
  background:var(--bg-alt);
}
.footer-inner{max-width:720px;margin:0 auto}
.footer-mark{
  width:48px;height:48px;
  background-image:var(--logo-mark);
  background-size:contain;background-repeat:no-repeat;background-position:center;
  margin:0 auto 18px;
}
.footer-brand{
  font-family:var(--font-display);
  font-size:26px;
  color:var(--text);
  margin-bottom:8px;
}
.footer-org{
  font-family:var(--font);
  font-size:12px;
  letter-spacing:0.14em;
  color:var(--text-muted);
  margin-bottom:24px;
}
.footer-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px 24px;
  margin-bottom:20px;
}
.footer-links a{
  font-family:var(--font);
  font-size:12px;
  letter-spacing:0.12em;
  color:var(--text-secondary);
}
.footer-links a:hover{color:var(--accent-warm)}
.footer-copy{
  font-family:var(--font);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--text-faint);
}

@media(max-width:680px){
  .top-bar{padding:0 16px;height:56px}
  .top-bar-mark{width:32px;height:32px}
  .top-bar-brand{gap:10px}
  .top-bar-brand-name{font-size:11.5px}
  .theme-toggle{padding:7px 11px;font-size:11px}
  .theme-toggle-label{display:none}
  main{padding:60px 20px 80px}
  .hero-corner{width:40px;height:40px}
  .hero-eyebrow{font-size:10.5px;letter-spacing:0.24em;margin-bottom:28px}
  .hero-title{margin-bottom:22px}
  .hero-status{font-size:20px;margin-bottom:28px}
  .hero-lead{font-size:15px;line-height:2.0}
  .hero-actions{flex-direction:column;align-items:stretch}
  .btn{width:100%}
  footer{padding:40px 20px 48px}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
<a href="https://journal.emerging-future.org/" class="top-bar-brand" aria-label="MIRA TUKU top">
<span class="top-bar-mark" aria-hidden="true"></span>
<span class="top-bar-brand-name">MIRA TUKU</span>
</a>
<button class="theme-toggle" onclick="toggleTheme()" aria-label="ダーク／ライト切替">
<svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="3" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21"/><line x1="3" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="7" y2="7"/><line x1="17" y1="17" x2="18.4" y2="18.4"/><line x1="5.6" y1="18.4" x2="7" y2="17"/><line x1="17" y1="7" x2="18.4" y2="5.6"/></svg>
<svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
<span class="theme-toggle-label">切替</span>
</button>
</header>

<!-- MAIN -->
<main>
<div class="hero">
<span class="hero-corner tl" aria-hidden="true">
<svg viewBox="0 0 56 56"><path d="M2 18 L2 2 L18 2"/><circle cx="2" cy="2" r="2.4" fill="currentColor" stroke="none" style="fill:var(--accent-warm)"/></svg>
</span>
<span class="hero-corner br" aria-hidden="true">
<svg viewBox="0 0 56 56"><path d="M2 18 L2 2 L18 2"/><circle cx="2" cy="2" r="2.4" fill="currentColor" stroke="none" style="fill:var(--accent-warm)"/></svg>
</span>

<div class="hero-eyebrow">NPO法人ミラツク</div>
<h1 class="hero-title"><span class="accent">F</span>utures</h1>
<p class="hero-status"><span class="hero-status-mark" aria-hidden="true"></span>ただいま準備中です</p>
<div class="hero-divider" aria-hidden="true"></div>
<p class="hero-lead">共に問うべき問いとともに、未来を描く ─ <strong>Futures</strong> は次の形に向けて準備を進めています。立ち上げを待つあいだは、連載「Futures ― 未来のかたち」全100話をお楽しみください。</p>
<p class="hero-meta">UPDATES — 2026年5月</p>
<div class="hero-actions">
<a href="https://journal.emerging-future.org/futures-series-v2/" class="btn btn-primary">連載「Futures」を読む</a>
<a href="mailto:contact@miratuku.org" class="btn">お問い合わせ</a>
</div>
</div>
</main>

<!-- FOOTER -->
<footer>
<div class="footer-inner">
<div class="footer-mark" aria-hidden="true"></div>
<div class="footer-brand">Futures</div>
<div class="footer-org">運営：NPO法人ミラツク</div>
<div class="footer-links">
<a href="https://journal.emerging-future.org/futures-series-v2/">連載「Futures」</a>
<a href="https://emerging-future.org/">ミラツク</a>
<a href="mailto:contact@miratuku.org">お問い合わせ</a>
</div>
<div class="footer-copy">© NPO法人ミラツク</div>
</div>
</footer>

<script>
(function(){
  var stored = localStorage.getItem("futures-lp-theme");
  if(stored){ document.documentElement.setAttribute("data-theme", stored); }
})();
function toggleTheme(){
  var html = document.documentElement;
  var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  localStorage.setItem("futures-lp-theme", next);
}
</script>

</body>
</html>
