const svg = d3.select("#graph");
const container = document.querySelector(".graph-container");
const width = container.clientWidth;
const height = container.clientHeight;
let showLabels = false;
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.1, 5]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);
const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(50).strength(0.3))
  .force("charge", d3.forceManyBody().strength(-80))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => d.size + 2));
const link = g.append("g").selectAll("line").data(data.links).enter().append("line")
  .attr("class", d => "link " + d.type);
const node = g.append("g").selectAll("circle").data(data.nodes).enter().append("circle")
  .attr("class", "node")
  .attr("r", d => d.size)
  .attr("fill", d => d.color)
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
const label = g.append("g").selectAll("text").data(data.nodes).enter().append("text")
  .attr("class", "label")
  .text(d => d.name)
  .attr("dx", d => d.size + 3).attr("dy", 3)
  .style("display", "none");
const tooltip = d3.select("#tooltip");
node.on("mouseover", (e, d) => {
  tooltip.style("display", "block")
    .html("<strong>" + d.name + "</strong><br><span style='color:#888;font-size:11px'>" + d.name_en + "</span><br><span style='color:" + d.color + "'>" + d.domain + "</span>");
}).on("mousemove", (e) => {
  tooltip.style("left", (e.pageX + 12) + "px").style("top", (e.pageY - 12) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));
simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("cx", d => d.x).attr("cy", d => d.y);
  label.attr("x", d => d.x).attr("y", d => d.y);
});
document.getElementById("resetZoom").onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
document.getElementById("toggleLabels").onclick = () => {
  showLabels = !showLabels;
  label.style("display", showLabels ? "block" : "none");
};
</script>
